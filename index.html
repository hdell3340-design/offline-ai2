<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Chat AI</title>
    <style>
        /* Dark Grey Minimalist Theme */
        body {
            background-color: #1a1a1a;
            color: #e5e5e5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 15px;
        }
        .user {
            background-color: #2e2e2e;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai {
            background-color: #121212;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .status {
            background-color: #2b2311;
            color: #ffb74d;
            align-self: center;
            font-size: 13px;
            text-align: center;
        }
        #input-panel {
            padding: 15px;
            background-color: #151515;
            display: flex;
            gap: 10px;
            border-top: 1px solid #2a2a2a;
        }
        input {
            flex: 1;
            background-color: #262626;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        button {
            background-color: #444;
            color: #fff;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled { background-color: #222; color: #555; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="message status" id="status-msg">
            Connecting to browser WebGPU pipeline...
        </div>
    </div>

    <div id="input-panel">
        <input type="text" id="user-input" placeholder="Type a message..." disabled>
        <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
    </div>

    <!-- Load the In-Browser AI Engine without installations -->
    <script type="module">
        import { pipeline } from 'https://jsdelivr.net';

        let generator = null;
        const statusMsg = document.getElementById('status-msg');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        async function initAI() {
            try {
                statusMsg.innerText = "Loading micro AI model weights into your browser memory... (First time only)";
                
                // Uses a micro text-generation model optimized to run purely inside web browsers via WebGPU
                generator = await pipeline('text-generation', 'Xenova/Qwen1.5-0.5B-Chat', {
                    device: 'webgpu' 
                });

                statusMsg.innerText = "AI successfully locked into browser cache! You can now disconnect your internet and use this app 100% offline.";
                userInput.disabled = false;
                sendBtn.disabled = false;
            } catch (err) {
                statusMsg.innerText = "WebGPU not supported or initialization failed. Retrying with CPU engine...";
                try {
                    generator = await pipeline('text-generation', 'Xenova/Qwen1.5-0.5B-Chat');
                    statusMsg.innerText = "AI loaded into browser via CPU. Ready for completely offline use!";
                    userInput.disabled = false;
                    sendBtn.disabled = false;
                } catch(e) {
                    statusMsg.innerText = "Error: App failed to spin up browser-level storage engine.";
                }
            }
        }

        window.sendMessage = async function() {
            const text = userInput.value.trim();
            if (!text || !generator) return;

            appendBubble(text, 'user');
            userInput.value = '';
            
            appendBubble("AI is thinking entirely offline...", 'ai-temp');

            // Generate responses directly out of your phone or computer memory
            const output = await generator(text, { max_new_tokens: 60, temperature: 0.7 });
            
            document.querySelector('.ai-temp').remove();
            appendBubble(output[0].generated_text, 'ai');
        }

        function appendBubble(text, className) {
            const container = document.getElementById('chat-container');
            const bubble = document.createElement('div');
            bubble.className = `message ${className}`;
            bubble.innerText = text;
            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
        }

        // Initialize engine automatically on script bootstrap
        initAI();
    </script>
</body>
</html>
